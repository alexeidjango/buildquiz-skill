<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f5f7fa;
    --ink: #161b26;
    --muted: #556075;
    --faint: #8892a4;
    --border: #d9dee7;
    --border-strong: #c3cad6;
    --accent: #2b5fb8;
    --accent-ink: #1f4a94;
    --accent-wash: #e3ebf8;
    --on-accent: #ffffff;
    --good: #17794a;
    --good-wash: #e0f2e8;
    --bad: #b3362b;
    --bad-wash: #f8e4e1;
    --warn: #93670f;
    --shadow: 0 1px 2px rgba(20,28,45,.05), 0 8px 24px -12px rgba(20,28,45,.18);
    --radius: 14px;
    --code-kw: #7a3fb0;
    --code-st: #17794a;
    --code-nu: #a2560a;
    --code-cm: #8892a4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e121a;
      --surface: #161c27;
      --surface-2: #1c2330;
      --ink: #e6eaf2;
      --muted: #a0abbe;
      --faint: #6f7a8e;
      --border: #283143;
      --border-strong: #38435a;
      --accent: #8fb0ff;
      --accent-ink: #b3c9ff;
      --accent-wash: #1c2b4a;
      --on-accent: #0b1428;
      --good: #5fd08f;
      --good-wash: #12301f;
      --bad: #f2867a;
      --bad-wash: #3a1d1a;
      --warn: #e2b456;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
      --code-kw: #c9a0f5;
      --code-st: #7fd8a2;
      --code-nu: #f0b072;
      --code-cm: #7c879b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e121a;
    --surface: #161c27;
    --surface-2: #1c2330;
    --ink: #e6eaf2;
    --muted: #a0abbe;
    --faint: #6f7a8e;
    --border: #283143;
    --border-strong: #38435a;
    --accent: #8fb0ff;
    --accent-ink: #b3c9ff;
    --accent-wash: #1c2b4a;
    --on-accent: #0b1428;
    --good: #5fd08f;
    --good-wash: #12301f;
    --bad: #f2867a;
    --bad-wash: #3a1d1a;
    --warn: #e2b456;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --code-kw: #c9a0f5;
    --code-st: #7fd8a2;
    --code-nu: #f0b072;
    --code-cm: #7c879b;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 calc(120px + env(safe-area-inset-bottom, 0px));
    min-width: 0;
  }

  /* header */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    margin: 0 -16px 18px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--border);
  }
  .titlerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 {
    font-family: "Montserrat", "Source Sans 3", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  h1 span { color: var(--accent-ink); }
  .headbtns { display: flex; gap: 8px; flex: none; }
  .quitbtn {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 8px;
    height: 32px;
    padding: 0 12px;
    font: inherit; font-size: .85rem; font-weight: 600;
    cursor: pointer;
  }
  .themebtn {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    width: 36px; height: 32px;
    font-size: 15px;
    cursor: pointer;
    flex: none;
  }
  .progress-track {
    height: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 9px;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }
  .meta {
    display: flex; justify-content: space-between;
    font-size: .8rem; color: var(--muted); margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* panels and choices */
  .stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .lede { color: var(--muted); font-size: .96rem; margin: 0; max-width: 62ch; }
  .grouplabel {
    font-family: "Montserrat", sans-serif;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: .72rem;
    font-weight: 700;
    color: var(--faint);
    margin: 18px 0 8px;
  }
  .grouplabel.first { margin-top: 0; }
  .choicegrid { display: grid; gap: 8px; }
  .choicegrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choice {
    display: flex; align-items: flex-start; gap: 11px;
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 12px 14px;
    background: var(--surface);
    cursor: pointer;
    font: inherit; font-size: .95rem;
    text-align: left; width: 100%;
    color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { opacity: .45; cursor: not-allowed; }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
  .mark {
    flex: none; width: 18px; height: 18px;
    border-radius: 6px;
    border: 2px solid var(--border-strong);
    margin-top: 2px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    color: var(--on-accent);
  }
  [data-shape="radio"] .mark { border-radius: 50%; }
  .choice[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); }
  .choice .mark::after { content: "✓"; opacity: 0; }
  .choice[aria-pressed="true"] .mark::after { opacity: 1; }
  .ctext { flex: 1; min-width: 0; }
  .csub { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }

  .btn {
    display: block; width: 100%;
    border: none; border-radius: 11px;
    padding: 14px;
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: 1rem;
    cursor: pointer;
    background: var(--accent);
    color: var(--on-accent);
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); }
  .btn.small { padding: 10px; font-size: .9rem; }
  .btn.danger { background: var(--bad); color: var(--surface); }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { flex: 1; }

  .statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .stat b {
    font-family: "Montserrat", sans-serif;
    font-size: 1.4rem; display: block;
    font-variant-numeric: tabular-nums;
  }
  .stat span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  /* question card */
  .qcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 16px;
    min-width: 0;
  }
  .qtags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: .7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 999px;
    background: var(--accent-wash); color: var(--accent-ink);
  }
  .tag.off { background: var(--surface-2); color: var(--warn); border: 1px solid var(--warn); }
  .tag.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .qtext { font-size: 1.05rem; line-height: 1.4; font-weight: 600; margin: 0 0 12px; text-wrap: pretty; }
  .code {
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: .78rem;
    line-height: 1.6;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 14px;
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    tab-size: 4;
    max-width: 100%;
    color: var(--ink);
  }
  .code .kw { color: var(--code-kw); font-weight: 600; }
  .code .st { color: var(--code-st); }
  .code .nu { color: var(--code-nu); }
  .code .cm { color: var(--code-cm); font-style: italic; }
  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px;
    border: 1.5px solid var(--border-strong);
    border-radius: 11px;
    padding: 12px 13px;
    background: var(--surface);
    cursor: pointer;
    text-align: left; width: 100%;
    color: var(--ink);
    font: inherit; font-size: .96rem; line-height: 1.38;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .letter {
    flex: none; width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    display: grid; place-items: center;
    font-size: .72rem; font-weight: 700;
    color: var(--muted);
    margin-top: 1px;
  }
  .opt .otext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .opt b { color: var(--accent-ink); font-weight: 700; }
  .qimg { margin: 0 0 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; cursor: zoom-in; }
  .qimg img { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; }
  .qimg.zoom { cursor: zoom-out; }
  .qimg.zoom img { max-height: none; }
  .reviewitem .qimg { margin: 8px 0; }
  .reviewitem .qimg img { max-height: 28vh; }
  .reviewitem .code { margin: 8px 0; }
  .opt.multi .letter { border-radius: 6px; }
  .qhint { font-size: .84rem; color: var(--muted); margin: -6px 0 12px; }
  .opt.missed { border-color: var(--good); border-style: dashed; }
  .opt.missed .verdict { color: var(--good); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
  .opt[aria-pressed="true"] .letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--good); background: var(--good-wash); }
  .opt.correct .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
  .opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .verdict {
    flex: none; align-self: center;
    font-size: .68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .opt.correct .verdict { color: var(--good); }
  .opt.wrong .verdict { color: var(--bad); }

  .explain {
    margin-top: 14px;
    border-left: 3px solid var(--accent);
    background: var(--surface-2);
    border-radius: 0 10px 10px 0;
    padding: 12px 14px;
    font-size: .93rem;
    overflow-wrap: anywhere;
  }
  .explain.ok { border-left-color: var(--good); }
  .explain.no { border-left-color: var(--bad); }
  .explain .head {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: .75rem;
    text-transform: uppercase; letter-spacing: .07em;
    margin-bottom: 4px;
  }
  .explain.ok .head { color: var(--good); }
  .explain.no .head { color: var(--bad); }
  .explain p { margin: 0 0 8px; }
  .explain p:last-child { margin-bottom: 0; }
  .explain .note { color: var(--warn); font-weight: 600; }
  .explain .why-not { color: var(--bad); font-weight: 600; }
  .linkbtn {
    background: none; border: none; padding: 0;
    color: var(--accent-ink); font: inherit; font-size: .88rem; font-weight: 600;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .other { margin-top: 10px; display: grid; gap: 8px; font-size: .88rem; }
  .other div { padding-left: 10px; border-left: 2px solid var(--border-strong); }
  .other div.is-ok { border-left-color: var(--good); }

  /* bottom bar */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .bar .btn { flex: 1; }
  .bar .btn.ghost { flex: 0 0 34%; }

  /* results */
  .score-big {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: 3rem; line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .score-big.pass { color: var(--good); }
  .score-big.fail { color: var(--bad); }
  .scoresub { color: var(--muted); margin: 6px 0 0; }
  .reviewitem {
    border: 1px solid var(--border);
    border-left: 3px solid var(--bad);
    border-radius: 0 10px 10px 0;
    padding: 11px 13px;
    font-size: .9rem;
    background: var(--surface);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .reviewitem.good { border-left-color: var(--good); }
  .reviewitem .rq { font-weight: 600; }
  .reviewitem .ra { display: block; margin-top: 4px; }
  .reviewitem .ra.good { color: var(--good); }
  .reviewitem .ra.bad { color: var(--bad); }
  .reviewlist { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }

  .foot { text-align: center; color: var(--faint); font-size: .8rem; margin: 4px 0 0; }
  .empty { text-align: center; }
  .empty .big { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 1.3rem; margin: 0 0 6px; }
  .hide { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 380px) { .choicegrid.two { grid-template-columns: 1fr; } }
</style>

<div lang="__LANG__">
<div class="wrap">
  <header>
    <div class="titlerow">
      <h1>__HEADING__ · <span>__SUBTITLE__</span></h1>
      <div class="headbtns">
        <button class="quitbtn" id="quitBtn" type="button" hidden data-t="quit"></button>
        <button class="themebtn" id="themeBtn" type="button" data-t-attr="theme">◐</button>
      </div>
    </div>
    <div class="progress-track" id="progWrap" hidden><div class="progress-fill" id="progFill"></div></div>
    <div class="meta" id="metaRow" hidden><span id="metaLeft"></span><span id="metaRight"></span></div>
  </header>

  <section id="setup" class="stack">
    <div class="panel">
      <p class="lede">__INTRO__</p>

      <div class="grouplabel" data-t="mode"></div>
      <div class="choicegrid" id="modePick">
        <button class="choice" type="button" data-shape="radio" data-val="learn" aria-pressed="true"><span class="mark"></span><span class="ctext"><span data-t="learn"></span> <span class="csub" data-t="learnDesc"></span></span></button>
        <button class="choice" type="button" data-shape="radio" data-val="drill" aria-pressed="false"><span class="mark"></span><span class="ctext"><span data-t="drill"></span> <span class="csub" data-t="drillDesc"></span></span></button>
        <button class="choice" type="button" data-shape="radio" data-val="sim" aria-pressed="false"><span class="mark"></span><span class="ctext"><span data-t="simMode"></span> <span class="csub" id="simDesc"></span></span></button>
      </div>

      <div class="grouplabel" data-t="area"></div>
      <div class="choicegrid two" id="areaPick">
__AREAS__
      </div>

      <div class="grouplabel" data-t="options"></div>
      <div class="choicegrid">
        <button class="choice" type="button" id="shuffleOpt" data-shape="check" aria-pressed="true"><span class="mark"></span><span class="ctext" data-t="shuffle"></span></button>
      </div>

      <div style="height:16px"></div>
      <button class="btn" type="button" id="startBtn" data-t="start"></button>
    </div>

    <div class="panel">
      <div class="grouplabel first" data-t="progress"></div>
      <div class="statgrid">
        <div class="stat"><b id="sSeen">0</b><span data-t="doneStat"></span></div>
        <div class="stat"><b id="sMastered">0</b><span data-t="masteredStat"></span></div>
        <div class="stat"><b id="sWeak">0</b><span data-t="weakStat"></span></div>
      </div>
      <div id="resetWrap">
        <button class="btn ghost small" type="button" id="resetBtn" data-t="reset"></button>
      </div>
      <div class="btnrow hide" id="resetConfirm">
        <button class="btn ghost small" type="button" id="resetNo" data-t="resetNo"></button>
        <button class="btn danger small" type="button" id="resetYes" data-t="resetYes"></button>
      </div>
    </div>

    <p class="foot" data-t="foot"></p>
  </section>

  <section id="quiz" class="stack hide"></section>
  <section id="results" class="stack hide"></section>
</div>

<div class="bar hide" id="bar">
  <div class="bar-inner">
    <button class="btn ghost" type="button" id="skipBtn" data-t="skip"></button>
    <button class="btn" type="button" id="actionBtn" data-t="check"></button>
  </div>
</div>
</div>

__LANGS__

<script>
if (location.hash === '#selftest-nostorage') {
  Object.defineProperty(window, 'localStorage', { get() { throw new Error('blocked'); } });
}
const BANK = JSON.parse(document.getElementById('bank').textContent);
const IMG = JSON.parse(document.getElementById('images').textContent);
const CFG = __CONFIG__;
const PASS_MARK = CFG.passMark;
const LANGS = JSON.parse(document.getElementById('langs').textContent);
let LANG = CFG.language;
let T = {};
let LETTERS = '';
let PLURAL = null;

/* A screen text of the current language; plural objects pick the form for vars.n, {name} takes vars[name]. */
function tr(key, vars) {
  vars = vars || {};
  let v = T[key];
  if (v && typeof v === 'object' && !Array.isArray(v)) v = v[PLURAL.select(vars.n)] || v.other;
  if (typeof v !== 'string') return v;
  return v.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}

/* Screen text inside HTML built from strings: marked with the screen language (the page root has the
   language of the questions). */
function L(text) {
  return '<span lang="' + LANG + '">' + text + '</span>';
}

function simDesc() {
  const parts = [];
  if (CFG.mix) {
    const n = Object.values(CFG.mix).reduce((x, y) => x + y, 0);
    const mix = Object.keys(CFG.areas).filter((g) => g in CFG.mix)
      .map((g) => CFG.mix[g] + ' ' + CFG.areas[g].toLocaleLowerCase(CFG.contentLanguage)).join(' + ');
    parts.push(tr('simMix', { n, parts: mix }));
  } else {
    parts.push(tr('simRandom', { n: CFG.count }));
  }
  if (PASS_MARK) parts.push(tr('simPassMark', { n: PASS_MARK }));
  parts.push(tr('simScore'));
  return parts.join(', ');
}

function setLanguage(code) {
  if (!LANGS[code]) code = CFG.language;
  LANG = code;
  T = LANGS[code].strings;
  LETTERS = LANGS[code].letters;
  PLURAL = new Intl.PluralRules(code);
  applyTexts();
  refreshCounts();
}
const GROUP = CFG.areas;
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function markup(t, bold) {
  const e = escapeHtml(t);
  return e.replace(/\*\*(.+?)\*\*/g, bold ? '<b>$1</b>' : '$1');
}

const KW = new Set(['import', 'from', 'as', 'for', 'in', 'if', 'elif', 'else', 'and', 'or', 'not', 'def',
  'return', 'while', 'True', 'False', 'None', 'lambda', 'range', 'len', 'print', 'set', 'list', 'sum',
  'max', 'min', 'sorted']);
function highlight(code) {
  const re = /(#[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_À-ɏͰ-Ͽ][\wÀ-ɏͰ-Ͽ]*)|([\s\S])/g;
  let out = '';
  let m;
  while ((m = re.exec(code)) !== null) {
    if (m[1]) out += '<span class="cm">' + escapeHtml(m[1]) + '</span>';
    else if (m[2]) out += '<span class="st">' + escapeHtml(m[2]) + '</span>';
    else if (m[3]) out += '<span class="nu">' + escapeHtml(m[3]) + '</span>';
    else if (m[4]) out += KW.has(m[4]) ? '<span class="kw">' + escapeHtml(m[4]) + '</span>' : escapeHtml(m[4]);
    else out += escapeHtml(m[5]);
  }
  return out;
}

function codeHtml(q) {
  return q.code ? '<pre class="code">' + highlight(q.code) + '</pre>' : '';
}

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

const KEY = CFG.storageKey;
const store = {
  get() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  },
  set(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* progress is not kept */ }
  },
  clear() {
    try { localStorage.removeItem(KEY); } catch (e) { /* progress is not kept */ }
  },
};

function stats(bank, st) {
  let seen = 0, mastered = 0, weak = 0;
  for (const q of bank) {
    const s = st[q.id];
    if (!s) continue;
    seen++;
    if (s.last === 'ok') mastered++; else weak++;
  }
  return { seen, mastered, weak };
}

function pickSim(bank) {
  if (CFG.mix) {
    const chosen = [];
    for (const g of Object.keys(CFG.mix)) {
      chosen.push(...shuffle(bank.filter((q) => q.area === g)).slice(0, CFG.mix[g]));
    }
    return shuffle(chosen);
  }
  return shuffle(bank).slice(0, CFG.count);
}

function queueFor(mode, area, bank, st) {
  if (mode === 'sim') return pickSim(bank);
  const pool = bank.filter((q) => area === 'all' || q.area === area);
  if (mode === 'drill') return shuffle(pool.filter((q) => !st[q.id] || st[q.id].last !== 'ok'));
  return shuffle(pool);
}

function record(id, ok) {
  const st = store.get();
  const s = st[id] || { c: 0, w: 0 };
  if (ok) s.c++; else s.w++;
  s.last = ok ? 'ok' : 'no';
  st[id] = s;
  store.set(st);
}

/* ---------- start screen ---------- */
function pickValue(groupId) {
  const b = $(groupId).querySelector('[aria-pressed="true"]');
  return b ? b.dataset.val : null;
}

function wireRadio(groupId, onChange) {
  $(groupId).addEventListener('click', (ev) => {
    const b = ev.target.closest('.choice');
    if (!b || b.disabled) return;
    for (const x of $(groupId).querySelectorAll('.choice')) x.setAttribute('aria-pressed', String(x === b));
    if (onChange) onChange(b.dataset.val);
  });
}

function syncAreaForMode(mode) {
  for (const b of $('areaPick').querySelectorAll('.choice')) b.disabled = mode === 'sim';
}

function refreshStats() {
  const s = stats(BANK, store.get());
  $('sSeen').textContent = s.seen + ' / ' + BANK.length;
  $('sMastered').textContent = s.mastered;
  $('sWeak').textContent = s.weak;
}

function refreshCounts() {
  const n = (g) => BANK.filter((q) => g === 'all' || q.area === g).length;
  for (const g of ['all', ...Object.keys(CFG.areas)]) {
    $('cnt' + (g === 'all' ? 'All' : g)).textContent = tr('questions', { n: n(g) });
  }
}

function showScreen(name) {
  $('setup').classList.toggle('hide', name !== 'setup');
  $('quiz').classList.toggle('hide', name !== 'quiz');
  $('results').classList.toggle('hide', name !== 'results');
  $('bar').classList.toggle('hide', name !== 'quiz');
  $('progWrap').hidden = name !== 'quiz';
  $('metaRow').hidden = name !== 'quiz';
  $('quitBtn').hidden = name !== 'quiz';
  window.scrollTo(0, 0);
}

function goHome() {
  state = null;
  refreshStats();
  showScreen('setup');
}

/* ---------- quiz flow ---------- */
let state = null;

function start(mode, area) {
  mode = mode || pickValue('modePick');
  area = area || pickValue('areaPick');
  const queue = queueFor(mode, area, BANK, store.get());
  state = {
    mode, area, queue,
    shuffleOpts: $('shuffleOpt').getAttribute('aria-pressed') === 'true',
    i: 0, answers: [], picked: new Set(), checked: false,
  };
  if (!queue.length) {
    renderEmpty();
    return;
  }
  showScreen('quiz');
  renderQuestion();
}

function renderEmpty() {
  showScreen('quiz');
  $('bar').classList.add('hide');
  $('quiz').innerHTML =
    '<div class="panel empty"><p class="big">' + L(T.emptyTitle) + '</p>' +
    '<p class="lede" style="margin:0 auto 16px">' + L(tr(PASS_MARK ? 'emptyTextExam' : 'emptyTextLearn')) + '</p>' +
    '<button class="btn" type="button" id="emptyBack">' + L(T.back) + '</button></div>';
  $('progWrap').hidden = true;
  $('metaRow').hidden = true;
  $('emptyBack').addEventListener('click', goHome);
}

function modeLabel(mode) {
  return { learn: T.learn, drill: T.drill, sim: PASS_MARK ? T.simShort : T.simCheck }[mode];
}

function isOk(a) {
  return a.picked.length === a.q.ok.length && a.q.ok.every((j) => a.picked.includes(j));
}

function imgHtml(q) {
  if (!q.img || !IMG[q.img]) return '';
  return '<figure class="qimg"><img src="' + IMG[q.img] + '" alt="' + T.imageAlt + '"></figure>';
}

function renderQuestion() {
  const q = state.queue[state.i];
  const n = state.queue.length;
  const idx = q.opts.map((_, j) => j);
  state.order = state.shuffleOpts ? shuffle(idx) : idx;
  state.picked = new Set();
  state.checked = false;
  const bold = state.mode !== 'sim';

  const opts = state.order.map((j, pos) =>
    '<button class="opt' + (q.multi ? ' multi' : '') + '" type="button" data-i="' + j + '" aria-pressed="false">' +
    '<span class="letter">' + LETTERS[pos] + '</span>' +
    '<span class="otext">' + markup(q.opts[j].t, bold) + '</span></button>').join('');

  $('quiz').innerHTML =
    '<article class="qcard">' +
    '<div class="qtags"><span class="tag">' + escapeHtml(GROUP[q.area]) + '</span>' +
    (q.off_source && state.mode !== 'sim' ? '<span class="tag off">' + (CFG.offSourceLabel ? escapeHtml(CFG.offSourceLabel) : L(T.offSource)) + '</span>' : '') + '</div>' +
    '<p class="qtext">' + escapeHtml(q.q) + '</p>' + imgHtml(q) + codeHtml(q) +
    '<p class="qhint">' + L(q.multi ? T.multiHint : T.singleHint) + '</p>' +
    '<div class="opts" id="opts">' + opts + '</div>' +
    '<div id="explainBox"></div>' +
    '</article>';

  $('opts').addEventListener('click', (ev) => {
    const b = ev.target.closest('.opt');
    if (!b || state.checked) return;
    const j = Number(b.dataset.i);
    if (q.multi) {
      if (state.picked.has(j)) state.picked.delete(j); else state.picked.add(j);
    } else {
      state.picked = new Set([j]);
    }
    for (const x of $('opts').querySelectorAll('.opt')) x.setAttribute('aria-pressed', String(state.picked.has(Number(x.dataset.i))));
    $('actionBtn').disabled = state.picked.size === 0;
  });

  const done = state.answers.filter(isOk).length;
  $('progFill').style.width = (100 * state.i / n) + '%';
  $('metaLeft').textContent = T.question + ' ' + (state.i + 1) + ' / ' + n;
  $('metaRight').textContent = state.mode === 'sim'
    ? modeLabel(state.mode) + (PASS_MARK ? ' · ' + T.passMark + ' ' + PASS_MARK : '')
    : modeLabel(state.mode) + ' · ' + T.correctSoFar + ' ' + done;
  $('actionBtn').textContent = T.check;
  $('actionBtn').disabled = true;
  $('skipBtn').classList.remove('hide');
  window.scrollTo(0, 0);
}

function explainHtml(q, picked, order, bold) {
  const ok = isOk({ q, picked });
  const wrong = picked.filter((j) => !q.ok.includes(j));
  const missed = q.ok.filter((j) => !picked.includes(j));
  let h = '<div class="explain ' + (ok ? 'ok' : 'no') + '">';
  h += '<div class="head">' + L(ok ? T.correct : picked.length ? (PASS_MARK ? T.wrongExam : T.wrong) : T.noAnswer) + '</div>';
  for (const j of wrong) h += '<p><span class="why-not">' + L(T.whyNot) + '</span> ' + markup(q.opts[j].t, bold) + '. ' + escapeHtml(q.opts[j].why) + '</p>';
  if (!ok) for (const j of missed) h += '<p><b>' + L(T.shouldBe) + '</b> ' + markup(q.opts[j].t, bold) + '. ' + escapeHtml(q.opts[j].why) + '</p>';
  if (ok) for (const j of q.ok) h += '<p>' + escapeHtml(q.opts[j].why) + '</p>';
  if (q.note) h += '<p class="note">' + escapeHtml(q.note) + '</p>';
  const others = order.map((j, pos) =>
    '<div' + (q.ok.includes(j) ? ' class="is-ok"' : '') + '><b>' + LETTERS[pos] + ')</b> ' + escapeHtml(q.opts[j].why) + '</div>').join('');
  h += '<p><button class="linkbtn" type="button" lang="' + LANG + '" data-toggle="other">' + T.showAll + '</button></p>' +
    '<div class="other hide">' + others + '</div></div>';
  return h;
}

function wireToggles(root) {
  root.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-toggle="other"]');
    if (!b) return;
    const box = b.closest('.explain').querySelector('.other');
    const open = box.classList.toggle('hide') === false;
    b.textContent = open ? T.hideAll : T.showAll;
  });
}

function reveal() {
  const q = state.queue[state.i];
  for (const b of $('opts').querySelectorAll('.opt')) {
    const j = Number(b.dataset.i);
    const isPicked = state.picked.has(j);
    b.disabled = true;
    b.setAttribute('aria-pressed', 'false');
    if (q.ok.includes(j)) {
      b.classList.add(isPicked ? 'correct' : 'missed');
      b.insertAdjacentHTML('beforeend', '<span class="verdict">' + L(isPicked ? T.vCorrect : T.vMissed) + '</span>');
    } else if (isPicked) {
      b.classList.add('wrong');
      b.insertAdjacentHTML('beforeend', '<span class="verdict">' + L(T.vPicked) + '</span>');
    }
  }
  $('explainBox').innerHTML = explainHtml(q, [...state.picked], state.order, true);
}

function check() {
  const q = state.queue[state.i];
  const a = { q, picked: [...state.picked], order: state.order };
  state.answers.push(a);
  if (state.mode === 'sim') {
    next();
    return;
  }
  record(q.id, isOk(a));
  reveal();
  state.checked = true;
  $('actionBtn').textContent = state.i + 1 === state.queue.length ? T.finish : T.next;
  $('skipBtn').classList.add('hide');
}

function skip() {
  if (state.checked) return;
  state.answers.push({ q: state.queue[state.i], picked: [], order: state.order });
  next();
}

function next() {
  state.i++;
  if (state.i >= state.queue.length) finish();
  else renderQuestion();
}

function reviewItem(a, withExplain) {
  const ok = isOk(a);
  const list = (ids) => ids.map((j) => markup(a.q.opts[j].t, false)).join(' · ');
  let h = '<div class="reviewitem' + (ok ? ' good' : '') + '">' +
    '<div class="qtags"><span class="tag">' + escapeHtml(GROUP[a.q.area]) + '</span></div>' +
    '<span class="rq">' + escapeHtml(a.q.q) + '</span>' + imgHtml(a.q) + codeHtml(a.q);
  if (!ok) {
    h += '<span class="ra bad">' + L(T.yourAnswer) + (a.picked.length ? list(a.picked) : L(T.noAnswerLower)) + '</span>';
  }
  h += '<span class="ra good">' + L(T.correctColon) + list(a.q.ok) + '</span>';
  if (withExplain) h += explainHtml(a.q, a.picked, a.order, false);
  return h + '</div>';
}

function finish() {
  const answers = state.answers;
  const correct = answers.filter(isOk).length;
  let h;
  if (state.mode === 'sim') {
    for (const a of answers) record(a.q.id, isOk(a));
    const pct = answers.length ? correct / answers.length : 0;
    let pass, msg;
    if (PASS_MARK) {
      pass = correct >= PASS_MARK;
      msg = (pass ? T.passed : T.failed) + ' ' + tr('passNeeded', { n: PASS_MARK });
    } else {
      pass = pct >= 0.7;
      msg = T.messages[pct >= 0.9 ? 0 : pct >= 0.7 ? 1 : pct >= 0.5 ? 2 : 3];
    }
    h = '<div class="panel"><div class="grouplabel first">' + L(PASS_MARK ? T.simExam : T.simCheck) + '</div>' +
      '<div class="score-big ' + (pass ? 'pass' : 'fail') + '">' + correct + ' / ' + answers.length + '</div>' +
      '<p class="scoresub">' + L(msg) + '</p></div>' +
      '<div class="reviewlist">' + answers.map((a) => reviewItem(a, true)).join('') + '</div>' +
      '<div class="btnrow"><button class="btn ghost" type="button" id="homeBtn">' + L(T.home) + '</button>' +
      '<button class="btn" type="button" id="againBtn">' + L(PASS_MARK ? T.newSim : T.newCheck) + '</button></div>';
  } else {
    const wrong = answers.filter((a) => !isOk(a));
    h = '<div class="panel"><div class="grouplabel first">' + L(modeLabel(state.mode) + ' · ' + T.endOfRound) + '</div>' +
      '<div class="score-big ' + (wrong.length === 0 ? 'pass' : 'fail') + '">' + correct + ' / ' + answers.length + '</div>' +
      '<p class="scoresub">' + L(wrong.length ? tr('toRepeat', { n: wrong.length }) + ' ' + T.skippedNote : T.allCorrect) + '</p></div>' +
      (wrong.length ? '<div class="reviewlist">' + wrong.map((a) => reviewItem(a, false)).join('') + '</div>' : '') +
      '<div class="btnrow"><button class="btn ghost" type="button" id="homeBtn">' + L(T.home) + '</button>' +
      '<button class="btn" type="button" id="againBtn">' + L(T.drill) + '</button></div>';
  }
  $('results').innerHTML = h;
  showScreen('results');
  const area = state.area;
  const sim = state.mode === 'sim';
  $('homeBtn').addEventListener('click', goHome);
  $('againBtn').addEventListener('click', () => start(sim ? 'sim' : 'drill', sim ? 'all' : area));
}

/* ---------- theme ---------- */
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  applyTheme(nxt);
  const st = store.get();
  st._theme = nxt;
  store.set(st);
}

/* ---------- startup ---------- */
function applyTexts() {
  for (const el of document.querySelectorAll('[data-t]')) {
    const k = el.dataset.t;
    el.textContent = k === 'simMode' ? (PASS_MARK ? T.simExam : T.simCheck) : T[k];
  }
  for (const el of document.querySelectorAll('[data-t-attr]')) {
    el.title = T[el.dataset.tAttr];
    el.setAttribute('aria-label', T[el.dataset.tAttr]);
  }
  $('simDesc').textContent = simDesc();
  for (const el of document.querySelectorAll('[data-t], [data-t-attr], .csub, #metaRow, #bar')) el.lang = LANG;
}

wireRadio('modePick', syncAreaForMode);
wireRadio('areaPick');
$('shuffleOpt').addEventListener('click', () => {
  const b = $('shuffleOpt');
  b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
});
$('startBtn').addEventListener('click', () => start());
$('actionBtn').addEventListener('click', () => {
  if (!state) return;
  if (state.checked) next();
  else if (state.picked.size > 0) check();
});
$('skipBtn').addEventListener('click', () => { if (state) skip(); });
$('themeBtn').addEventListener('click', toggleTheme);
$('quitBtn').addEventListener('click', goHome);
$('resetBtn').addEventListener('click', () => {
  $('resetWrap').classList.add('hide');
  $('resetConfirm').classList.remove('hide');
});
$('resetNo').addEventListener('click', () => {
  $('resetConfirm').classList.add('hide');
  $('resetWrap').classList.remove('hide');
});
$('resetYes').addEventListener('click', () => {
  const theme = store.get()._theme;
  store.clear();
  if (theme) store.set({ _theme: theme });
  $('resetConfirm').classList.add('hide');
  $('resetWrap').classList.remove('hide');
  refreshStats();
});
wireToggles($('quiz'));
wireToggles($('results'));
document.addEventListener('click', (ev) => {
  const f = ev.target.closest('.qimg');
  if (f) f.classList.toggle('zoom');
});

setLanguage(CFG.language);
applyTheme(store.get()._theme);
refreshStats();

/* ---------- self-test (render_check.py opens the page with #selftest) ---------- */
async function selfTest() {
  let step = 'counts';
  const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
  const clickFirst = () => {
    $('opts').querySelector('.opt').click();
    $('actionBtn').click();
  };
  try {
    assert(BANK.length > 0, 'empty bank');
    assert($('cntAll').textContent.startsWith(BANK.length + ' '), 'cntAll shows ' + $('cntAll').textContent);

    step = 'learn';
    start('learn', 'all');
    clickFirst();
    assert(document.querySelector('#explainBox .explain'), 'no explanation after check');

    step = 'drill';
    goHome();
    start('drill', 'all');
    assert(document.querySelector('#quiz .qcard'), 'no question in drill mode');

    step = 'sim';
    goHome();
    start('sim', 'all');
    for (let i = 0; i < 1000 && $('results').classList.contains('hide'); i++) clickFirst();
    const expected = CFG.mix
      ? Object.keys(CFG.mix).reduce((s, g) => s + Math.min(CFG.mix[g], BANK.filter((q) => q.area === g).length), 0)
      : Math.min(CFG.count, BANK.length);
    const res = document.querySelector('#results .score-big');
    assert(res, 'no result screen');
    const m = res.textContent.match(/^(\d+) \/ (\d+)$/);
    assert(m && Number(m[2]) === expected, 'score "' + res.textContent + '", expected / ' + expected);

    let img = 0, code = 0;
    const withImg = BANK.find((q) => q.img);
    if (withImg) {
      step = 'picture';
      start('learn', 'all');
      state.queue = [withImg];
      state.i = 0;
      renderQuestion();
      const el = document.querySelector('#quiz .qimg img');
      assert(el, 'picture not rendered');
      await el.decode();
      assert(el.naturalWidth > 0, 'picture has no pixels');
      el.click();
      assert(el.closest('.qimg').classList.contains('zoom'), 'tap does not zoom');
      img = 1;
    }
    const withCode = BANK.find((q) => q.code);
    if (withCode) {
      step = 'code';
      start('learn', 'all');
      state.queue = [withCode];
      state.i = 0;
      renderQuestion();
      assert(document.querySelector('#quiz pre.code'), 'code block not rendered');
      code = 1;
    }
    goHome();
    return 'SELFTEST OK modes=3 sim=' + expected + ' img=' + img + ' code=' + code;
  } catch (e) {
    return 'SELFTEST FAIL ' + step + ': ' + e.message;
  }
}

if (location.hash === '#selftest' || location.hash === '#selftest-nostorage') {
  selfTest().then((r) => {
    const pre = document.createElement('pre');
    pre.id = 'selftest';
    pre.textContent = r;
    document.body.appendChild(pre);
  });
}
